mdp:
  # 未配置到 mdc_resource_api 的接口一律拒绝（白名单模式）：
  # 菜单删除/接口解绑后接口自动不可调，符合"下掉功能"的运维直觉
  ignore:
    not-config-uri-allow: false
  system:
    forgetPasswordUrl: 'https://workbench.mddata.top/#/auth/forget-password-update?token='
  log:
    ipv4:
      enabled: true
      xdbPath: file:/data_mdp/target/ip2region_v4.xdb
    ipv6:
      enabled: true
      xdbPath: file:/data_mdp/target/ip2region_v6.xdb
  file:
    tempStoragePath: /data_mdp/temp/
  social:
    wechat-open:
      enabled: ${WECHAT_OPEN_ENABLED:true}
      client-id: ${WECHAT_OPEN_CLIENT_ID:}
      client-secret: ${WECHAT_OPEN_CLIENT_SECRET:}
      redirect-uri: ${WECHAT_OPEN_REDIRECT_URI:https://workbench.mddata.top/#/auth/social/callback/wechat-open}
      union-id: ${WECHAT_OPEN_UNION_ID:true}
      http-timeout-millis: 10000
    qq:
      enabled: ${QQ_ENABLED:true}
      client-id: ${QQ_CLIENT_ID:}
      client-secret: ${QQ_CLIENT_SECRET:}
      redirect-uri: ${QQ_REDIRECT_URI:https://workbench.mddata.top/#/auth/social/callback/qq}
      http-timeout-millis: 10000
    ding-talk:
      enabled: ${DINGTALK_ENABLED:true}
      client-id: ${DINGTALK_CLIENT_ID:}
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      redirect-uri: ${DINGTALK_REDIRECT_URI:https://workbench.mddata.top/#/auth/social/callback/dingtalk}
      corp-id: ${DINGTALK_CORP_ID:}
      http-timeout-millis: 10000

